:root{--pink:#f6c6e8;--lime:#ecff6c;--ink:#161616;--dark:#222222;--line:rgba(22,22,22,.55);
  --num:"KNum","Inter Display","Helvetica Neue",Arial,sans-serif;
  --head:"KHead","Inter Display","Helvetica Neue",Arial,sans-serif;
  --mono:"KMono",ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--pink);color:var(--ink);font-family:var(--mono);min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.slide{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.pad{padding:0 20px}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 20px 0;font-size:12px;letter-spacing:.04em}
.hl{background:var(--lime);padding:2px 6px;-webkit-box-decoration-break:clone;box-decoration-break:clone;text-transform:uppercase;font-weight:700}
.hl.soft{font-weight:400;text-transform:none}

.hero{position:relative;margin:22px 20px 0}
.limecard{position:relative;background:var(--lime);padding:20px 22px 22px;box-shadow:7px 7px 0 rgba(22,22,22,.55);width:78%}
.limecard h1{margin:0;font-family:var(--head);font-weight:500;font-size:clamp(38px,12vw,56px);line-height:.92;letter-spacing:-.045em}
.sticker{position:absolute;right:-6px;top:-18px;width:104px;height:104px;transform:rotate(12deg)}
.sticker text{font-family:var(--head);font-weight:500;font-size:21px;fill:var(--ink)}
.lead{margin:20px 20px 0;font-size:12.5px;line-height:1.5;max-width:330px}

.dark{margin:22px 0 0;background:var(--dark);color:var(--lime);padding:18px 20px 20px;border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink)}
.dark .cap{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#d9d9d9;display:flex;justify-content:space-between}
.dark .cap b{color:var(--lime)}
.amtline{display:flex;align-items:baseline;gap:10px;margin-top:6px}
#amt{flex:1;min-width:0;width:100%;background:none;border:0;outline:0;color:var(--lime);font-family:var(--num);font-weight:200;font-size:clamp(46px,15vw,72px);line-height:1.05;letter-spacing:-.03em;font-feature-settings:"zero","tnum";padding:0;caret-color:var(--lime)}
#amt::placeholder{color:rgba(236,255,108,.35)}
.curtag{font-family:var(--mono);font-weight:700;font-size:15px;color:var(--ink);background:var(--lime);padding:3px 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border:1.5px solid rgba(236,255,108,.55);color:var(--lime);padding:8px 12px;font-size:13px;font-weight:700;letter-spacing:.04em}
.chip.on{background:var(--lime);color:var(--ink);border-color:var(--lime)}

.list{padding:6px 20px 0;flex:1}
.row{display:grid;grid-template-columns:26px 1fr;column-gap:10px;width:100%;text-align:left;padding:16px 0 15px;border-bottom:1px solid var(--line)}
.row .ar{width:20px;height:20px;margin-top:10px}
.row .ar svg{width:100%;height:100%;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:square}
.row .n{font-family:var(--num);font-weight:200;font-size:clamp(40px,13vw,60px);line-height:1.02;letter-spacing:-.035em;font-feature-settings:"zero","tnum";word-break:break-all}
.row .meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:8px}
.row .meta .hl{font-size:11px}
.row .meta small{font-size:11px;opacity:.8}
.row .rate{font-size:11px;margin-top:6px;opacity:.75}

.note{margin:14px 20px 0;font-size:11px;line-height:1.5;opacity:.8}
.strip{margin-top:18px;border-top:1.5px solid var(--ink);display:flex;align-items:stretch;font-size:11px;letter-spacing:.04em;padding-bottom:env(safe-area-inset-bottom)}
.strip>*{display:flex;align-items:center;padding:12px 12px;border-right:1px solid var(--line)}
.strip .no{min-width:44px;justify-content:center;font-weight:700}
.strip .sp{flex:1;border-right:0}
.strip .logo{font-family:var(--head);font-weight:500;font-size:19px;letter-spacing:-.04em;border-right:0}
.strip .go{width:50px;justify-content:center;border-right:0;border-left:1px solid var(--line)}
.strip .go svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:square}
.go.spin svg{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:var(--ink);color:var(--lime);padding:10px 16px;font-size:12px;opacity:0;pointer-events:none;transition:.25s;z-index:5;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="slide">
  <div class="top"><span class="hl">Калькулятор валют</span><span id="rdate">—</span></div>

  <section class="hero">
    <div class="limecard"><h1>Курс<br>валют</h1></div>
    <svg class="sticker" viewBox="0 0 100 100" aria-hidden="true">
      <polygon id="burst" fill="#f6c6e8" stroke="#161616" stroke-width="1.6" points=""/>
      <text x="50" y="57" text-anchor="middle">live</text>
    </svg>
  </section>
  <p class="lead">Введи сумму в любой валюте. Ниже сразу видно, сколько это в остальных. Нажми на любую строку, чтобы считать от неё.</p>

  <section class="dark">
    <div class="cap"><span>Ты вводишь</span><b id="basename">Российский рубль</b></div>
    <div class="amtline"><input id="amt" inputmode="decimal" autocomplete="off" placeholder="0" aria-label="Сумма"><span class="curtag" id="curtag">RUB</span></div>
    <div class="chips" id="chips"></div>
  </section>

  <section class="list" id="list" aria-live="polite"></section>
  <p class="note" id="note"></p>

  <footer class="strip">
    <span class="no">01</span>
    <span id="stripdate">КУРС | —</span>
    <span class="sp"></span>
    <span class="logo">обновить</span>
    <button class="go" id="refresh" aria-label="Обновить курс"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg></button>
  </footer>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
'use strict';
const CUR = [
  {c:'RUB', n:'Российский рубль', s:'₽'},
  {c:'USD', n:'Доллар США', s:'$'},
  {c:'EUR', n:'Евро', s:'€'},
  {c:'AED', n:'Дирхам ОАЭ', s:'AED'},
  {c:'AMD', n:'Армянский драм', s:'AMD'},
  {c:'TRY', n:'Турецкая лира', s:'₺'}
];
// запасной курс, если нет интернета и ещё ничего не сохранялось (курс на 10.10.2026, 1 USD = ...)
const FALLBACK = { date:'2026-10-10', rates:{USD:1, RUB:84.989692, EUR:0.892383, AED:3.6725, AMD:361.957381, TRY:49.339277}, approx:true };
const KEY='kurs_v1', RKEY='kurs_rates_v1', MAXAGE=3*3600*1000;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let st={base:'RUB', amt:'1000'};
let rates=null; // {date, rates, t, approx}

function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

// звезда-стикер
(function(){ const n=14, pts=[]; for(let i=0;i<n*2;i++){ const a=Math.PI*i/n - Math.PI/2, r=i%2?39:48; pts.push((50+r*Math.cos(a)).toFixed(1)+','+(50+r*Math.sin(a)).toFixed(1)); } $('#burst').setAttribute('points',pts.join(' ')); })();

function parseAmt(s){ const v=parseFloat(String(s).replace(/[\s ]/g,'').replace(',','.')); return isFinite(v)&&v>=0?v:0; }
function fmt(v){
  if(!isFinite(v)) return '0';
  const a=Math.abs(v);
  const d = a>=1000?0 : a>=1?2 : a>0?4 : 0;
  return new Intl.NumberFormat('ru-RU',{maximumFractionDigits:d,minimumFractionDigits:0}).format(v);
}
function convert(v,from,to){ const r=rates.rates; return v/r[from]*r[to]; }
function dstr(s){ const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||''); return m?m[3]+'.'+m[2]+'.'+m[1]:'—'; }
function rateTxt(from,to){
  const r=convert(1,from,to); const d=r>=100?2:r>=1?3:5;
  return '1 '+from+' = '+new Intl.NumberFormat('ru-RU',{maximumFractionDigits:d,minimumFractionDigits:0}).format(r)+' '+to;
}
const ARROW='<svg viewBox="0 0 24 24"><path d="M6 6l12 12"/><path d="M18 8v10H8"/></svg>';

function render(keepInput){
  const base=CUR.find(x=>x.c===st.base);
  $('#curtag').textContent=base.c; $('#basename').textContent=base.n;
  if(!keepInput) $('#amt').value=st.amt;
  $('#chips').innerHTML=CUR.map(x=>'<button class="chip'+(x.c===st.base?' on':'')+'" data-base="'+x.c+'">'+x.c+'</button>').join('');
  const v=parseAmt(st.amt);
  $('#list').innerHTML=CUR.filter(x=>x.c!==st.base).map(x=>
    '<button class="row" data-pick="'+x.c+'"><span class="ar">'+ARROW+'</span><span><div class="n">'+esc(fmt(convert(v,st.base,x.c)))+'</div>'+
    '<div class="meta"><span class="hl">'+x.c+'</span><small>'+esc(x.n)+'</small></div><div class="rate">'+esc(rateTxt(st.base,x.c))+'</div></span></button>').join('');
  const d=dstr(rates.date);
  $('#rdate').textContent=d; $('#stripdate').textContent='КУРС | '+d;
  $('#note').textContent=(rates.approx?'Примерный курс на '+d+': не удалось загрузить свежий. ':'')+'Курс ориентировочный (рыночный). В банках и обменниках он обычно немного отличается.';
}

function save(){ lsSet(KEY,st); }
let toastT; function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('on'),2200); }

async function getJSON(url){
  const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),9000);
  try{ const r=await fetch(url,{signal:ctl.signal,cache:'no-store'}); if(!r.ok) throw new Error('http'); return await r.json(); } finally{ clearTimeout(to); }
}
function pick(all){ const out={USD:1}; for(const x of CUR){ if(x.c==='USD') continue; const v=all[x.c]; if(!(v>0)) throw new Error('bad'); out[x.c]=v; } return out; }
async function loadRates(manual){
  const btn=$('#refresh'); btn.classList.add('spin');
  try{
    let got=null;
    try{
      const j=await getJSON('https://open.er-api.com/v6/latest/USD');
      if(j.result==='success'){ got={date:new Date(j.time_last_update_utc||Date.now()).toISOString().slice(0,10), rates:pick(j.rates)}; }
    }catch(e){}
    if(!got){
      const j=await getJSON('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json');
      const up={}; for(const k in j.usd) up[k.toUpperCase()]=j.usd[k];
      got={date:j.date, rates:pick(up)};
    }
    rates={date:got.date, rates:got.rates, t:Date.now()}; lsSet(RKEY,rates); render(true);
    if(manual) toast('Курс обновлён ✓');
  }catch(e){
    if(manual) toast('Нет интернета. Показан сохранённый курс');
  }finally{ btn.classList.remove('spin'); }
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-base]'), p=e.target.closest('[data-pick]');
  if(b){
    const nb=b.dataset.base; if(nb===st.base) return;
    const v=parseAmt(st.amt); const nv=convert(v,st.base,nb);
    st.base=nb; st.amt=String(Math.round(nv*100)/100).replace('.',','); save(); render();
  }
  if(p){
    const nb=p.dataset.pick; const v=parseAmt(st.amt); const nv=convert(v,st.base,nb);
    st.base=nb; st.amt=String(Math.round(nv*100)/100).replace('.',','); save(); render(); window.scrollTo({top:0,behavior:'smooth'});
  }
});
$('#amt').addEventListener('input',e=>{
  let s=e.target.value.replace(/[^0-9.,\s]/g,''); if(s!==e.target.value) e.target.value=s;
  st.amt=s; save(); render(true);
});
$('#amt').addEventListener('focus',e=>setTimeout(()=>e.target.select(),0));
$('#refresh').addEventListener('click',()=>loadRates(true));
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && (!rates||Date.now()-(rates.t||0)>MAXAGE)) loadRates(false); });

// старт
const s0=lsGet(KEY); if(s0&&CUR.some(x=>x.c===s0.base)&&typeof s0.amt==='string') st=s0;
const cached=lsGet(RKEY);
if(cached&&cached.rates&&CUR.every(x=>cached.rates[x.c]>0)) rates=cached; else rates=Object.assign({},FALLBACK);
render();
if(!cached||Date.now()-(cached.t||0)>MAXAGE) loadRates(false); else loadRates(false);
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>
</body>
</html>
