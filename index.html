<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Курс валют</title>
<meta name="theme-color" content="#f6c6e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Курс">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="kurs.webmanifest">
<link rel="apple-touch-icon" href="kurs-icon-180.png">
<link rel="icon" href="kurs-icon-192.png">
<style>
:root{--pink:#f6c6e8;--lime:#ecff6c;--ink:#161616;--dark:#222222;--line:rgba(22,22,22,.18);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--pink);color:var(--ink);font-family:var(--font)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.slide{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 14px 0}
.top{display:flex;justify-content:space-between;align-items:center;padding:6px 4px 12px}
.top h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.top h1 span{background:var(--lime);padding:0 8px;border-radius:8px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.datechip{font-size:13px;font-weight:600;background:rgba(255,255,255,.55);border-radius:999px;padding:6px 11px}

.dark{background:var(--dark);color:var(--lime);border-radius:22px;padding:13px 14px 14px}
.cap{display:flex;justify-content:space-between;font-size:13px;color:#cfcfcf;font-weight:500}
.cap b{color:var(--lime);font-weight:700}
.amtline{display:flex;align-items:center;gap:10px;margin:4px 0 10px}
#amt{flex:1;min-width:0;width:100%;background:none;border:0;outline:0;color:var(--lime);font-family:var(--font);font-weight:700;font-size:clamp(34px,11vw,46px);line-height:1.15;letter-spacing:-.02em;font-variant-numeric:tabular-nums;padding:0;caret-color:var(--lime)}
#amt::placeholder{color:rgba(236,255,108,.35)}
.curtag{font-weight:800;font-size:15px;color:var(--ink);background:var(--lime);padding:4px 10px;border-radius:10px}
.chips{display:flex;gap:6px}
.chip{flex:1;border:1.5px solid rgba(236,255,108,.45);color:var(--lime);padding:8px 0;font-size:13px;font-weight:700;border-radius:12px;text-align:center}
.chip.on{background:var(--lime);color:var(--ink);border-color:var(--lime)}

.list{margin-top:12px;display:grid;gap:8px}
.row{min-width:0;display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:rgba(255,255,255,.62);border-radius:20px;padding:10px 14px 10px 10px}
.row:active{background:rgba(255,255,255,.85)}
.flag{flex:none;width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:26px;line-height:1;box-shadow:0 2px 6px rgba(22,22,22,.12)}
.nm{flex:none;display:flex;flex-direction:column;min-width:0}
.nm b{font-size:18px;font-weight:800;letter-spacing:-.01em}
.nm small{font-size:12px;color:#5b4a56;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:104px}
@media(max-width:360px){.nm small{max-width:70px}.flag{width:38px;height:38px;font-size:22px}}
.val{flex:1;min-width:0;text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.val b{font-size:clamp(20px,6.4vw,26px);font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15;overflow-wrap:anywhere}
.val small{font-size:12px;color:#5b4a56;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

.hint{margin:10px 6px 0;font-size:12px;line-height:1.45;color:#5b4a56}
.strip{margin-top:auto;padding:12px 4px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600}
.strip .upd{display:flex;align-items:center;gap:8px;background:var(--lime);border-radius:999px;padding:9px 14px;font-weight:700}
.strip svg{width:17px;height:17px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.upd.spin svg{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:var(--ink);color:var(--lime);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:5;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="slide">
  <div class="top"><h1><span>Курс валют</span></h1><span class="datechip" id="rdate">—</span></div>

  <section class="dark">
    <div class="cap"><span>Ты вводишь</span><b id="basename">Российский рубль</b></div>
    <div class="amtline"><input id="amt" inputmode="decimal" autocomplete="off" placeholder="0" aria-label="Сумма"><span class="curtag" id="curtag">RUB</span></div>
    <div class="chips" id="chips"></div>
  </section>

  <section class="list" id="list" aria-live="polite"></section>
  <p class="hint" id="hint">Нажми на строку, чтобы считать от этой валюты.</p>
  <p class="hint" id="note"></p>

  <footer class="strip">
    <span id="stripdate">Курс на —</span>
    <button class="upd" id="refresh" aria-label="Обновить курс"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>Обновить</button>
  </footer>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
'use strict';
const CUR = [
  {c:'RUB', n:'Российский рубль', f:'🇷🇺'},
  {c:'USD', n:'Доллар США', f:'🇺🇸'},
  {c:'EUR', n:'Евро', f:'🇪🇺'},
  {c:'AED', n:'Дирхам ОАЭ', f:'🇦🇪'},
  {c:'AMD', n:'Армянский драм', f:'🇦🇲'},
  {c:'TRY', n:'Турецкая лира', f:'🇹🇷'}
];
// запасной курс, если нет интернета и ещё ничего не сохранялось (курс на 10.10.2026, 1 USD = ...)
const FALLBACK = { date:'2026-10-10', rates:{USD:1, RUB:84.989692, EUR:0.892383, AED:3.6725, AMD:361.957381, TRY:49.339277}, approx:true };
const KEY='kurs_v1', RKEY='kurs_rates_v1', MAXAGE=3*3600*1000;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let st={base:'RUB', amt:'1000'};
let rates=null; // {date, rates, t, approx}

function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }


function parseAmt(s){ const v=parseFloat(String(s).replace(/[\s ]/g,'').replace(',','.')); return isFinite(v)&&v>=0?v:0; }
function fmt(v){
  if(!isFinite(v)) return '0';
  const a=Math.abs(v);
  const d = a>=1000?0 : a>=1?2 : a>0?4 : 0;
  return new Intl.NumberFormat('ru-RU',{maximumFractionDigits:d,minimumFractionDigits:0}).format(v);
}
function convert(v,from,to){ const r=rates.rates; return v/r[from]*r[to]; }
function dstr(s){ const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||''); return m?m[3]+'.'+m[2]+'.'+m[1]:'—'; }
function rateTxt(from,to){
  const r=convert(1,to,from); const d=r>=100?2:r>=1?3:5;
  return '1 '+to+' = '+new Intl.NumberFormat('ru-RU',{maximumFractionDigits:d,minimumFractionDigits:0}).format(r)+' '+from;
}

function render(keepInput){
  const base=CUR.find(x=>x.c===st.base);
  $('#curtag').textContent=base.c; $('#basename').textContent=base.n;
  if(!keepInput) $('#amt').value=st.amt;
  $('#chips').innerHTML=CUR.map(x=>'<button class="chip'+(x.c===st.base?' on':'')+'" data-base="'+x.c+'">'+x.c+'</button>').join('');
  const v=parseAmt(st.amt);
  $('#list').innerHTML=CUR.filter(x=>x.c!==st.base).map(x=>
    '<button class="row" data-pick="'+x.c+'"><span class="flag">'+x.f+'</span><span class="nm"><b>'+x.c+'</b><small>'+esc(x.n)+'</small></span>'+
    '<span class="val"><b>'+esc(fmt(convert(v,st.base,x.c)))+'</b><small>'+esc(rateTxt(st.base,x.c))+'</small></span></button>').join('');
  const d=dstr(rates.date);
  $('#rdate').textContent=d; $('#stripdate').textContent='Курс на '+d;
  $('#note').textContent=(rates.approx?'Примерный курс на '+d+': не удалось загрузить свежий. ':'')+'Курс ориентировочный (рыночный): в банках и обменниках он обычно немного отличается.';
}

function save(){ lsSet(KEY,st); }
let toastT; function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('on'),2200); }

async function getJSON(url){
  const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),9000);
  try{ const r=await fetch(url,{signal:ctl.signal,cache:'no-store'}); if(!r.ok) throw new Error('http'); return await r.json(); } finally{ clearTimeout(to); }
}
function pick(all){ const out={USD:1}; for(const x of CUR){ if(x.c==='USD') continue; const v=all[x.c]; if(!(v>0)) throw new Error('bad'); out[x.c]=v; } return out; }
async function loadRates(manual){
  const btn=$('#refresh'); btn.classList.add('spin');
  try{
    let got=null;
    try{
      const j=await getJSON('https://open.er-api.com/v6/latest/USD');
      if(j.result==='success'){ got={date:new Date(j.time_last_update_utc||Date.now()).toISOString().slice(0,10), rates:pick(j.rates)}; }
    }catch(e){}
    if(!got){
      const j=await getJSON('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json');
      const up={}; for(const k in j.usd) up[k.toUpperCase()]=j.usd[k];
      got={date:j.date, rates:pick(up)};
    }
    rates={date:got.date, rates:got.rates, t:Date.now()}; lsSet(RKEY,rates); render(true);
    if(manual) toast('Курс обновлён ✓');
  }catch(e){
    if(manual) toast('Нет интернета. Показан сохранённый курс');
  }finally{ btn.classList.remove('spin'); }
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-base]'), p=e.target.closest('[data-pick]');
  if(b){
    const nb=b.dataset.base; if(nb===st.base) return;
    const v=parseAmt(st.amt); const nv=convert(v,st.base,nb);
    st.base=nb; st.amt=String(Math.round(nv*100)/100).replace('.',','); save(); render();
  }
  if(p){
    const nb=p.dataset.pick; const v=parseAmt(st.amt); const nv=convert(v,st.base,nb);
    st.base=nb; st.amt=String(Math.round(nv*100)/100).replace('.',','); save(); render(); window.scrollTo({top:0,behavior:'smooth'});
  }
});
$('#amt').addEventListener('input',e=>{
  let s=e.target.value.replace(/[^0-9.,\s]/g,''); if(s!==e.target.value) e.target.value=s;
  st.amt=s; save(); render(true);
});
$('#amt').addEventListener('focus',e=>setTimeout(()=>e.target.select(),0));
$('#refresh').addEventListener('click',()=>loadRates(true));
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && (!rates||Date.now()-(rates.t||0)>MAXAGE)) loadRates(false); });

// старт
const s0=lsGet(KEY); if(s0&&CUR.some(x=>x.c===s0.base)&&typeof s0.amt==='string') st=s0;
const cached=lsGet(RKEY);
if(cached&&cached.rates&&CUR.every(x=>cached.rates[x.c]>0)) rates=cached; else rates=Object.assign({},FALLBACK);
render();
if(!cached||Date.now()-(cached.t||0)>MAXAGE) loadRates(false); else loadRates(false);
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>
</body>
</html>
